packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true

catalog:
  "@types/node": 24.12.4
  "@types/react": ~19.2.14
  "@types/react-dom": ~19.2.3
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  electron: 41.10.3
  electron-builder: 26.15.6
  react: 19.2.6
  react-dom: 19.2.6
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2

overrides:
  "@vitest/browser@4.1.9": 4.1.10
  "@vitest/browser-preview@4.1.9": 4.1.10
  "vitest@4.1.9": 4.1.10
  brace-expansion: 5.0.8
  "fast-uri@3.1.3": 3.1.4
  "js-yaml@4.2.0": 4.3.0
  "postcss@8.5.16": 8.5.18
  "tar@7.5.19": 7.5.21
  vite: "catalog:"

patchedDependencies:
  "@legendapp/list@3.2.0": patches/@legendapp__list@3.2.0.patch

packageExtensions:
  vite-plus@*:
    dependencies:
      vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [ current, x64, arm64 ]
  libc: [ current, glibc ]
  os: [ current, linux, darwin ]
