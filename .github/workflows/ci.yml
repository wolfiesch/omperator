name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      continuity: ${{ steps.classify.outputs.continuity }}
      cluster: ${{ steps.classify.outputs.cluster }}
      official_omp_gate0: ${{ steps.classify.outputs.official_omp_gate0 }}
      tooling: ${{ steps.classify.outputs.tooling }}
      maintainer: ${{ steps.classify.outputs.maintainer }}
      ios: ${{ steps.classify.outputs.ios }}
      android_debug: ${{ steps.classify.outputs.android_debug }}
    steps:
      - name: Check out source and base history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Test path classification
        run: node --test scripts/ci-paths.test.mjs scripts/ci-baseline.test.mjs

      # A merge run classifies against the newest green ancestor rather than
      # its immediate parent. A run that failed is never a baseline, so its
      # commits stay inside the next run's diff until some run actually proves
      # them, which keeps the exact-commit conclusion that
      # `scripts/wait-for-exact-ci.mjs` reads a complete proof. With no green
      # ancestor the run falls back to the full matrix.
      - name: Classify affected CI legs
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" | node scripts/ci-paths.mjs >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != push ]]; then
            node scripts/ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          baseline="$(node scripts/ci-baseline.mjs --head "$HEAD_SHA")"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "no green ancestor; running every leg"
            node scripts/ci-paths.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "classifying against green ancestor $baseline"
          git diff --name-only -z "$baseline...$HEAD_SHA" | node scripts/ci-paths.mjs >> "$GITHUB_OUTPUT"

  t4-api-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI and deterministic generation
        run: |
          pnpm --filter @t4-code/t4-api-contract validate
          pnpm --filter @t4-code/t4-api-contract generate:ci
          pnpm --filter @t4-code/t4-api-contract check:generated
          pnpm --filter @t4-code/t4-api-client typecheck
          pnpm --filter @t4-code/client typecheck
          pnpm --filter @t4-code/client exec vp test run test/t4-api-v1-conformance.test.ts
      - name: Upload deterministic T4 API client
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t4-api-generated-${{ github.run_id }}
          path: artifacts/t4-api/generated/schema.ts
          if-no-files-found: error



  # `core` used to run setup, browser download, lint and types, unit tests,
  # build, end-to-end, and packaging as one serial 2m30s job. These three run
  # in parallel: two extra ~20s setups buy lint and type feedback at ~30s
  # instead of ~65s, and the critical path becomes build-e2e.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and types
        run: pnpm check

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install Bun for the T4 host packages
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install Bun for the T4 host packages
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser bundle is keyed by the lockfile, so it changes only when the
      # pinned Playwright version does. System libraries belong to the runner
      # image rather than the cache, so `install-deps` still runs on a hit.
      - name: Restore the pinned Playwright browser
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser for end-to-end tests
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium

      - name: Build all workspaces
        run: pnpm build

      - name: Run built-app end-to-end tests
        run: pnpm test:e2e

      - name: Check packaging contract
        run: pnpm test:packaging

      # Cache entries are immutable per key, so only persist a browser bundle
      # the end-to-end suite has already driven. Bump the key salt to force a
      # fresh download.
      - name: Save the proven Playwright browser
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

  # Release-time gates, deferred to pushes. The legacy pin is a frozen
  # historical compatibility proof and the gate0 matrix spans three runners
  # including macOS. Pushes to main classify as --all, so both still run on
  # every merge before any release, and `pnpm verify:affected` selects them
  # locally for an affected change. They are keyed on `push` rather than on
  # "not a pull request" because `verify` no longer waits on them: running a
  # macOS and arm64 matrix inside a merge group would occupy scarce runners
  # without gating the queue.
  legacy-bridge-continuity:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.continuity == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact T4 source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install continuity prerequisites
        run: sudo apt-get update && sudo apt-get install --yes expect

      - name: Install T4 dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve pinned OMP authority source
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          source_repository="$(jq -er '.verifiedRuntime.sourceRepository' compat/omp-app-matrix.json)"
          test "$source_repository" = "https://github.com/wolfiesch/oh-my-pi"
          sha="$(jq -er '.inputs.operationsContinuity' provenance/omp-host-migration.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=wolfiesch/oh-my-pi" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out pinned OMP authority source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ steps.authority.outputs.repository }}
          ref: ${{ steps.authority.outputs.sha }}
          path: .continuity/omp

      - name: Restore the pinned OMP native addon
        id: legacy-native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .continuity/omp/packages/natives/native
          key: omp-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.authority.outputs.sha }}

      - name: Install OMP authority dependencies
        working-directory: .continuity/omp
        run: bun install --frozen-lockfile

      # A pinned commit and a fixed runner platform produce a byte-identical
      # addon, so a hit skips a ~7 minute cold Rust build (fat-LTO workspace).
      - name: Build OMP native addon
        if: ${{ steps.legacy-native-cache.outputs.cache-hit != 'true' }}
        working-directory: .continuity/omp
        run: bun run build:native

      - name: Run legacy bridge continuity gate
        env:
          T4_OMP_SOURCE_DIR: ${{ github.workspace }}/.continuity/omp
        run: pnpm test:legacy-bridge-continuity

      # Cache entries are immutable per key, so only persist an addon the gate
      # has already loaded and exercised. Bump the key salt to force a rebuild.
      - name: Save the proven OMP native addon
        if: ${{ steps.legacy-native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .continuity/omp/packages/natives/native
          key: ${{ steps.legacy-native-cache.outputs.cache-primary-key }}

      - name: Upload continuity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-bridge-continuity-${{ github.run_id }}
          path: artifacts/legacy-bridge-continuity/
          if-no-files-found: error
          retention-days: 14

  current-bridge-continuity:
    needs: changes
    if: ${{ needs.changes.outputs.continuity == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact T4 source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install T4 dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve current OMP authority source
        id: current-authority
        shell: bash
        run: |
          set -euo pipefail
          source_repository="$(jq -er '.verifiedRuntime.sourceRepository' compat/omp-app-matrix.json)"
          test "$source_repository" = "https://github.com/wolfiesch/oh-my-pi"
          sha="$(jq -er '.verifiedRuntime.sourceCommit' compat/omp-app-matrix.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=wolfiesch/oh-my-pi" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out current OMP authority source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ steps.current-authority.outputs.repository }}
          ref: ${{ steps.current-authority.outputs.sha }}
          path: .current-continuity/omp

      - name: Install current OMP authority dependencies
        working-directory: .current-continuity/omp
        run: bun install --frozen-lockfile

      - name: Restore the release-proven native addon
        id: release-native
        run: |
          node scripts/fetch-omp-release-native.mjs \
            --matrix compat/omp-app-matrix.json \
            --source-dir .current-continuity/omp

      - name: Restore the current OMP native addon cache
        if: ${{ steps.release-native.outputs.restored != 'true' }}
        id: current-native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .current-continuity/omp/packages/natives/native
          key: omp-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.current-authority.outputs.sha }}

      # A pinned commit and a fixed runner platform produce a byte-identical
      # addon. Older OMP releases lack the public provenance manifest, so retain
      # the exact-commit Actions cache as their migration fallback.
      - name: Build current OMP native addon
        if: ${{ steps.release-native.outputs.restored != 'true' && steps.current-native-cache.outputs.cache-hit != 'true' }}
        working-directory: .current-continuity/omp
        run: bun run build:native

      - name: Run current OMP authority source tests
        working-directory: .current-continuity/omp
        run: bun test packages/coding-agent/test/appserver-bridge.test.ts packages/coding-agent/test/appserver-session-lifecycle.test.ts

      - name: Run current bridge compatibility proof
        env:
          T4_CURRENT_OMP_SOURCE_DIR: ${{ github.workspace }}/.current-continuity/omp
        run: pnpm --filter @t4-code/host-service verify:current-omp-bridge

      # Cache entries are immutable per key, so only persist an addon that has
      # already satisfied the bridge contract this job exists to prove. Bump the
      # key salt to force a rebuild.
      - name: Save the proven current OMP native addon
        if: ${{ steps.release-native.outputs.restored != 'true' && steps.current-native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .current-continuity/omp/packages/natives/native
          key: ${{ steps.current-native-cache.outputs.cache-primary-key }}

      - name: Upload current bridge evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-omp-bridge-${{ github.run_id }}
          path: artifacts/current-omp-bridge/
          if-no-files-found: error
          retention-days: 14

  official-omp-gate0:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.official_omp_gate0 == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    name: official-omp-gate0 (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out exact T4 source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the pinned unmodified official OMP runtime
        run: pnpm --filter @t4-code/host-service verify:official-omp-lifecycle

      - name: Prove the packaged T4 host against official OMP
        run: pnpm --filter @t4-code/host-daemon verify:official-omp-packaged

      - name: Upload official OMP Gate 0 evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-omp-gate0-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            artifacts/official-omp-gate0/${{ matrix.platform }}.json
            artifacts/official-omp-packaged-host/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  cluster:
    needs: changes
    if: ${{ needs.changes.outputs.cluster == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: packages/cluster-operator/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Helm
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Run cluster CI proof contracts
        run: pnpm test:cluster:ci

      - name: Run cluster server tests
        run: pnpm --filter @t4-code/cluster-server test

      - name: Run model gateway tests
        run: pnpm --filter @t4-code/model-gateway test

      - name: Run session runtime credential preflight tests
        run: bun test cluster/images/session-runtime/assert-omp-credentials-absent.test.ts

      - name: Typecheck cluster server
        run: pnpm --filter @t4-code/cluster-server typecheck

      - name: Typecheck model gateway
        run: pnpm --filter @t4-code/model-gateway typecheck

      - name: Run cluster protocol contracts
        run: |
          pnpm --filter @t4-code/host-wire exec bun test test/cluster-operator.test.ts
          pnpm --filter @t4-code/host-service exec bun test test/cluster-default-off.test.ts

      - name: Run operator tests
        working-directory: packages/cluster-operator
        env:
          GOFLAGS: -mod=readonly
        run: go test ./...

      - name: Lint cluster chart
        run: helm lint deploy/charts/t4-cluster

  tooling:
    needs: changes
    if: ${{ needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tooling regression tests
        run: pnpm test:tooling

  maintainer:
    needs: changes
    if: ${{ needs.changes.outputs.maintainer == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run maintainer deployment regression tests
        run: pnpm test:maintainer

  android-debug:
    needs: changes
    if: ${{ needs.changes.outputs.android_debug == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm build:web

      - name: Verify unsigned Android debug application
        run: pnpm --filter @t4-code/mobile check:android:debug

  # A same-repository pull request can use the provisioned M1 when its circuit
  # breaker is enabled. Forks, pushes, merge groups, and disabled-M1 runs stay
  # on an ephemeral hosted runner. GitHub does not reassign a queued
  # self-hosted job automatically, so disable M1_CI_ENABLED and rerun if the
  # machine is offline.
  ios:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.M1_CI_ENABLED == 'true' && '["self-hosted","macOS","ARM64","wolfie-m1","trusted"]' || '"macos-26"') }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Validate the provisioned Apple toolchain
        if: ${{ runner.name == 'wolfie-m1-omperator' }}
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/homebrew/bin/xcodegen
          developer_dir="$(xcode-select -p)"
          test -d "$developer_dir"
          xcode_version="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | awk 'NR == 1 { print $2 }')"
          test -n "$xcode_version"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          {
            echo "DEVELOPER_DIR=$developer_dir"
            echo "ARCHS=arm64"
            echo "ONLY_ACTIVE_ARCH=YES"
            echo "T4_IOS_DERIVED_DATA_PATH=$HOME/Library/Caches/omperator-ci/ios/xcode-$xcode_version/derived-data"
          } >> "$GITHUB_ENV"
          T4_IOS_CACHE_MIN_FREE_GIB=11 \
            T4_IOS_CACHE_ROOT="$HOME/Library/Caches/omperator-ci/ios/xcode-$xcode_version" \
            node scripts/prepare-ios-ci-cache.mjs
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          /opt/homebrew/bin/xcodegen --version
          DEVELOPER_DIR="$developer_dir" xcodebuild -showComponent MetalToolchain -json
          DEVELOPER_DIR="$developer_dir" xcrun simctl list runtimes available | grep -F "iOS "

      - name: Install XcodeGen
        if: ${{ runner.name != 'wolfie-m1-omperator' }}
        run: brew install xcodegen

      - name: Report the toolchain under test
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Build the application and run its XCUITest bundle
        env:
          T4_IOS_TIMINGS_PATH: ${{ runner.temp }}/omperator-ios-timings.json
        run: node scripts/verify-ios.mjs

      - name: Report iOS phase timings
        if: ${{ always() }}
        shell: bash
        env:
          T4_IOS_TIMINGS_PATH: ${{ runner.temp }}/omperator-ios-timings.json
        run: |
          if [[ ! -f "$T4_IOS_TIMINGS_PATH" ]]; then
            echo "No completed iOS timing report was produced."
            exit 0
          fi
          cat "$T4_IOS_TIMINGS_PATH"
          {
            echo "### iOS phase timings"
            echo '```json'
            cat "$T4_IOS_TIMINGS_PATH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce iOS cache bounds
        if: ${{ always() && runner.name == 'wolfie-m1-omperator' }}
        run: |
          xcode_version="$(DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version | awk 'NR == 1 { print $2 }')"
          T4_IOS_CACHE_MIN_FREE_GIB=11 \
            T4_IOS_CACHE_ROOT="$HOME/Library/Caches/omperator-ci/ios/xcode-$xcode_version" \
            node scripts/prepare-ios-ci-cache.mjs

  # The branch-protection gate. It waits only on legs that run on ubuntu-24.04
  # for a pull request, so a merge run's macOS and arm64 matrix cannot hold the
  # required check behind a queued runner. The deferred release gates are
  # aggregated separately below and still decide the workflow run conclusion,
  # which is what `scripts/wait-for-exact-ci.mjs` requires before a release.
  verify:
    name: verify
    if: ${{ always() }}
    needs: [changes, t4-api-generation, check, unit-tests, build-e2e, current-bridge-continuity, cluster, tooling, maintainer, android-debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected CI leg
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          T4_API_GENERATION_RESULT: ${{ needs.t4-api-generation.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          BUILD_E2E_RESULT: ${{ needs.build-e2e.result }}
          CURRENT_CONTINUITY_RESULT: ${{ needs.current-bridge-continuity.result }}
          CLUSTER_RESULT: ${{ needs.cluster.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          MAINTAINER_RESULT: ${{ needs.maintainer.result }}
          ANDROID_RESULT: ${{ needs.android-debug.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$T4_API_GENERATION_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          test "$BUILD_E2E_RESULT" = success
          for result in \
            "$CURRENT_CONTINUITY_RESULT" \
            "$CLUSTER_RESULT" \
            "$TOOLING_RESULT" \
            "$MAINTAINER_RESULT" \
            "$ANDROID_RESULT"
          do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  # The deferred release-time legs, plus the macOS iOS build. The release gates
  # are skipped on pull requests; the iOS leg is not, so this job can fail a
  # pull request run without ever blocking the required `verify` check. A
  # failure here fails the run that `scripts/wait-for-exact-ci.mjs` demands be
  # green before publishing.
  release-gates:
    name: release-gates
    if: ${{ always() }}
    needs: [changes, legacy-bridge-continuity, official-omp-gate0, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every deferred release gate
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTINUITY_RESULT: ${{ needs.legacy-bridge-continuity.result }}
          OFFICIAL_OMP_GATE0_RESULT: ${{ needs.official-omp-gate0.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          for result in \
            "$CONTINUITY_RESULT" \
            "$OFFICIAL_OMP_GATE0_RESULT" \
            "$IOS_RESULT"
          do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
