            httpGet: {path: /healthz, port: admin}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            failureThreshold: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            failureThreshold: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.modelGateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: provider-credential
              mountPath: /var/run/secrets/t4-model-gateway
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
        - name: provider-credential
          secret:
            secretName: {{ .Values.modelGateway.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.modelGateway.credentialKey | quote }}
                path: credential
