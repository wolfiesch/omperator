apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "server") | quote }}
  labels:
    {{- include "t4-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "t4-cluster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        cluster.t4.dev/pre-stop-method: POST
        cluster.t4.dev/pre-stop-path: /drainz
      labels:
        {{- include "t4-cluster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: t4-cluster
    spec:
      serviceAccountName: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "server") | quote }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: {{ toJson .Values.session.nodeExclude }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "t4-cluster.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: server
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "t4-cluster.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
      containers:
        - name: server
          image: {{ include "t4-cluster.image" .Values.images.server | quote }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy | quote }}
          env:
            - name: T4_CLUSTER_SERVER_PORT
              value: "8080"
            - name: T4_CLUSTER_ADMIN_PORT
              value: "9090"
            {{- if or .Values.server.identity.configMapRef.name .Values.server.identity.secretRef.name }}
            - name: T4_CLUSTER_IDENTITY_CONFIG_FILE
              value: /var/run/t4-identity/config.json
            {{- else }}
            - name: T4_CLUSTER_IDENTITY_PROVIDER
              value: "tailscale"
            {{- end }}
            - name: T4_CLUSTER_TRUSTED_PROXY_ADDRESSES
              value: {{ join "," .Values.server.trustedProxyAddresses | quote }}
            - name: T4_CLUSTER_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.server.trustedProxyCIDRs | quote }}
            - name: T4_PUBLIC_REST_BASE_URL
              value: {{ .Values.server.publicApi.restBaseURL | quote }}
            - name: T4_PUBLIC_OMP_APP_WEBSOCKET_URL
              value: {{ .Values.server.publicApi.ompAppWebSocketURL | quote }}
            - name: T4_BUILD_VERSION
              value: {{ .Values.server.publicApi.build.version | quote }}
            - name: T4_BUILD_REVISION
              value: {{ .Values.server.publicApi.build.revision | quote }}
            - name: T4_BUILD_BUILT_AT
              value: {{ .Values.server.publicApi.build.builtAt | quote }}
            - name: T4_ADMISSION_MAX_ACTIVE_RUNTIMES
              value: {{ .Values.server.admission.maxActiveRuntimes | quote }}
            - name: T4_ADMISSION_MAX_RETAINED_RUNTIMES
              value: {{ .Values.server.admission.maxRetainedRuntimes | quote }}
            - name: T4_ADMISSION_MAX_WORKSPACE_CAPACITY_BYTES
              value: {{ .Values.server.admission.maxWorkspaceCapacityBytes | quote }}
            - name: T4_ADMISSION_MAX_CPU_MILLIS
              value: {{ .Values.server.admission.maxCpuMillis | quote }}
            - name: T4_ADMISSION_MAX_MEMORY_BYTES
              value: {{ .Values.server.admission.maxMemoryBytes | quote }}
            - name: T4_ADMISSION_MAX_GPU_UNITS
              value: {{ .Values.server.admission.maxGpuUnits | quote }}
            - name: T4_ADMISSION_BROWSER_ENABLED
              value: {{ .Values.server.admission.browserEnabled | quote }}
            - name: T4_ADMISSION_RUNTIME_CPU_MILLIS
              value: {{ .Values.server.admission.runtimeResources.cpuMillis | quote }}
            - name: T4_ADMISSION_RUNTIME_MEMORY_BYTES
              value: {{ .Values.server.admission.runtimeResources.memoryBytes | quote }}
            - name: T4_ADMISSION_RUNTIME_GPU_UNITS
              value: {{ .Values.server.admission.runtimeResources.gpuUnits | quote }}
            - name: T4_ADMISSION_CREATION_WINDOW_SECONDS
              value: {{ .Values.server.admission.creationRate.windowSeconds | quote }}
            - name: T4_ADMISSION_CREATION_BURST
              value: {{ .Values.server.admission.creationRate.burst | quote }}
            - name: T4_ADMISSION_MAXIMUM_RETRY_AFTER_SECONDS
              value: {{ .Values.server.admission.creationRate.maximumRetryAfterSeconds | quote }}
            - name: T4_CLUSTER_HOST_NAME
              value: {{ .Values.clusterHost.name | quote }}
            - name: T4_CLUSTER_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/t4-cluster-identity/token
            - name: T4_CLUSTER_SERVER_SERVICE_ACCOUNT
              value: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "server") | quote }}
            - name: T4_KUBERNETES_API_AUDIENCE
              value: {{ .Values.kubernetes.apiAudience | quote }}
            - name: T4_KUBERNETES_TOKEN_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: T4_KUBERNETES_CA_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            {{- if and .Values.sshGateway.enabled .Values.sshGateway.commands.provider }}
            - name: T4_PROVIDER_INTERNAL_HMAC_FILE
              value: /var/run/secrets/t4-provider-assertion/keyring.json
            - name: T4_PROVIDER_INTERNAL_AUDIENCE
              value: {{ regexReplaceAll "^wss?://" (default (printf "ws://%s.%s.svc:8080/internal/provider" (include "t4-cluster.suffixedName" (dict "context" . "suffix" "server")) .Release.Namespace) .Values.sshGateway.providerInternalWebSocketURL) "" | quote }}
            {{- end }}
            {{- if .Values.woodpecker.existingSecret }}
            - name: T4_WOODPECKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woodpecker.existingSecret | quote }}
                  key: {{ .Values.woodpecker.tokenKey | quote }}
            {{- else if .Values.woodpecker.serviceAccountAudience }}
            - name: T4_WOODPECKER_TOKEN_FILE
              value: /var/run/secrets/t4-ci/token
            {{- end }}
            {{- if .Values.woodpecker.configMap }}
            - name: T4_WOODPECKER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.woodpecker.configMap | quote }}
                  key: {{ .Values.woodpecker.baseURLKey | quote }}
            - name: T4_WOODPECKER_WEB_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.woodpecker.configMap | quote }}
                  key: {{ .Values.woodpecker.webBaseURLKey | quote }}
            - name: T4_WOODPECKER_REPOSITORIES
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.woodpecker.configMap | quote }}
                  key: {{ .Values.woodpecker.repositoriesKey | quote }}
            {{- end }}
          ports:
            - name: websocket
              containerPort: 8080
            - name: admin
              containerPort: 9090
          lifecycle:
            preStop:
              exec:
                command: [/usr/bin/curl, -fsS, -X, POST, http://127.0.0.1:9090/drainz]
          startupProbe:
            httpGet: {path: /healthz, port: admin}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            failureThreshold: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            failureThreshold: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: cluster-identity
              mountPath: /var/run/secrets/t4-cluster-identity
              readOnly: true
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- if or .Values.server.identity.configMapRef.name .Values.server.identity.secretRef.name }}
            - name: request-identity
              mountPath: /var/run/t4-identity
              readOnly: true
            {{- end }}
            {{- if .Values.woodpecker.serviceAccountAudience }}
            - name: ci-identity
              mountPath: /var/run/secrets/t4-ci
              readOnly: true
            {{- end }}
            {{- if and .Values.sshGateway.enabled .Values.sshGateway.commands.provider }}
            - name: provider-assertion
              mountPath: /var/run/secrets/t4-provider-assertion
              readOnly: true
            {{- end }}
      volumes:
        {{- if or .Values.server.identity.configMapRef.name .Values.server.identity.secretRef.name }}
        - name: request-identity
          {{- if .Values.server.identity.configMapRef.name }}
          configMap:
            name: {{ .Values.server.identity.configMapRef.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.server.identity.configMapRef.key | quote }}
                path: config.json
          {{- else }}
          secret:
            secretName: {{ .Values.server.identity.secretRef.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.server.identity.secretRef.key | quote }}
                path: config.json
          {{- end }}
        {{- end }}
        {{- if and .Values.sshGateway.enabled .Values.sshGateway.commands.provider }}
        - name: provider-assertion
          secret:
            secretName: {{ .Values.sshGateway.existingProviderAssertionSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.sshGateway.providerAssertionKeyringKey | quote }}
                path: keyring.json
        {{- end }}
        - name: cluster-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: "t4-cluster-internal"
                  expirationSeconds: 600
                  path: token
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.kubernetes.apiAudience | quote }}
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- if .Values.woodpecker.serviceAccountAudience }}
        - name: ci-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.woodpecker.serviceAccountAudience | quote }}
                  expirationSeconds: {{ .Values.woodpecker.tokenExpirationSeconds }}
                  path: token
        {{- end }}
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
{{- if .Values.modelGateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "model-gateway") | quote }}
  labels:
