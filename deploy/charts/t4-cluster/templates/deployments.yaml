              value: {{ toJson .Values.modelGateway.allowedPaths | quote }}
            - name: T4_MODEL_GATEWAY_CREDENTIAL_HEADER
              value: {{ .Values.modelGateway.credentialHeader | quote }}
            - name: T4_MODEL_GATEWAY_CREDENTIAL_FILE
