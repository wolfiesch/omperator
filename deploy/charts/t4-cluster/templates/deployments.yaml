{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "controller") | quote }}
  labels:
    {{- include "t4-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "t4-cluster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "t4-cluster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: t4-cluster
    spec:
      serviceAccountName: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "controller") | quote }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: {{ toJson .Values.session.nodeExclude }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "t4-cluster.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: controller
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "t4-cluster.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      containers:
        - name: controller
          image: {{ include "t4-cluster.image" .Values.images.controller | quote }}
          imagePullPolicy: {{ .Values.images.controller.pullPolicy | quote }}
          args: ["--zap-log-level=info"]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: T4_SESSION_RUNTIME_IMAGE
              value: {{ include "t4-cluster.image" .Values.images.sessionRuntime | quote }}
            - name: T4_RUNTIME_ACTIVITY_POLL_SECONDS
              value: {{ .Values.controller.runtimeActivityPollSeconds | quote }}
            - name: T4_SESSION_OMP_CONFIG_MAP
              value: {{ .Values.session.omp.configMap | quote }}
            - name: T4_SESSION_OMP_MODELS_KEY
              value: {{ .Values.session.omp.modelsKey | quote }}
            - name: T4_SESSION_OMP_SETTINGS_KEY
              value: {{ .Values.session.omp.settingsKey | quote }}
            - name: T4_SESSION_TOKEN_REVIEWER_CLUSTER_ROLE
              value: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "session-token-reviewer") | quote }}
            - name: T4_CLUSTER_SERVER_SERVICE_ACCOUNT
              value: {{ include "t4-cluster.suffixedName" (dict "context" . "suffix" "server") | quote }}
            - name: T4_KUBERNETES_API_AUDIENCE
              value: {{ .Values.kubernetes.apiAudience | quote }}
            - name: T4_SESSION_EXCLUDED_NODES
              value: {{ join "," .Values.session.nodeExclude | quote }}
            - name: T4_SESSION_REQUEST_CPU
              value: {{ .Values.session.resources.requests.cpu | quote }}
            - name: T4_SESSION_REQUEST_MEMORY
              value: {{ .Values.session.resources.requests.memory | quote }}
            - name: T4_SESSION_LIMIT_CPU
              value: {{ .Values.session.resources.limits.cpu | quote }}
            - name: T4_SESSION_LIMIT_MEMORY
              value: {{ .Values.session.resources.limits.memory | quote }}
            - name: T4_SESSION_SHM_SIZE
              value: {{ .Values.session.sharedMemorySize | quote }}
            - name: T4_SESSION_TEMPORARY_SIZE
              value: {{ .Values.session.temporarySize | quote }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet: {path: /healthz, port: health}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            failureThreshold: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            failureThreshold: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.kubernetes.apiAudience | quote }}
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
