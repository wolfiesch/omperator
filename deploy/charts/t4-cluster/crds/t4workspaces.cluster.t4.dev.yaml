apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: t4workspaces.cluster.t4.dev
spec:
  group: cluster.t4.dev
  scope: Namespaced
  names:
    plural: t4workspaces
    singular: t4workspace
    kind: T4Workspace
    listKind: T4WorkspaceList
    shortNames: [t4ws]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PVC
          type: string
          jsonPath: .status.pvcName
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [hostRef, displayName, owner, size, retentionPolicy]
              x-kubernetes-validations:
                - rule: "!has(self.repository) || !has(self.repository.commit) || (has(self.repository.ref) && self.repository.ref != '')"
                  message: repository commit requires an explicit ref
                - rule: "!has(oldSelf.storageClassName) || (has(self.storageClassName) && self.storageClassName == oldSelf.storageClassName)"
                  message: storageClassName is immutable once set
                - rule: "!has(oldSelf.restoreSnapshotRef) || (has(self.restoreSnapshotRef) && self.restoreSnapshotRef == oldSelf.restoreSnapshotRef)"
                  message: restoreSnapshotRef is immutable once set
              properties:
                publicId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,127}$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: publicId is immutable
                hostRef:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: hostRef is immutable
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                owner:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: '^[^\x00-\x1F\x7F]+$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: owner is immutable
                repository:
                  type: object
                  required: [repositoryId]
                  properties:
                    repositoryId:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
                    ref:
                      type: string
                      minLength: 1
                      maxLength: 256
                    commit:
                      type: string
                      minLength: 7
                      maxLength: 64
                      pattern: '^[0-9a-fA-F]+$'
                size:
                  type: string
                  minLength: 2
                  maxLength: 32
                  pattern: '^(0|[1-9][0-9]*)(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K)?$'
                allowCrashConsistentRestore:
                  type: boolean
                  default: false
                restorePublicIdPolicy:
                  type: string
                  default: Preserve
                  enum: [Preserve, Replace]
                storageClassName:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$'
                restoreSnapshotRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$'
                retentionPolicy:
                  type: string
                  enum: [Retain, Delete]
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                pvcName:
                  type: string
                  minLength: 1
                  maxLength: 63
                pvcPhase:
                  type: string
                  enum: [Pending, Bound, Lost]
                capacity:
                  type: string
                  minLength: 1
                  maxLength: 32
                selectedStorageClassName:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$'
                filesystemRoot:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                attachmentCount:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 100000
                snapshotRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$'
                phase:
                  type: string
                  enum: [Pending, Ready, Failed, Terminating, Unknown]
                conditions:
                  type: array
                  maxItems: 8
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        enum: [StorageReady, Ready, HostReady]
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                        maxLength: 64
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: '^[A-Za-z][A-Za-z0-9]*$'
                      message:
                        type: string
                        maxLength: 512
