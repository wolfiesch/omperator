# Separately ordered CRDs.
#
# The three cluster.t4.dev CRDs are reconciled by their own Kustomization, and
# the HelmRelease dependsOn this object. Helm therefore never creates, upgrades,
# or deletes a CustomResourceDefinition.
#
# This example is safe for a fresh install and for an already-validated
# additive change. It performs no additive-compatibility preflight, no live
# custom-resource enumeration, and no served-schema convergence check. Run
# `scripts/cluster-ci/crd-lifecycle.sh upgrade -- helm upgrade ... --skip-crds`
# against the same commit before advancing this source ref for any CRD change,
# and treat a red gate as a stop, not a retry.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: t4-cluster-crds
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  path: ./deploy/charts/t4-cluster/crds
  sourceRef:
    kind: GitRepository
    name: t4-code
  # Deleting a CRD deletes every T4ClusterHost, T4Workspace, and T4Session in
  # the cluster regardless of retention intent. Pruning is refused here; CRD
  # removal is an explicit administrative operation.
  prune: false
  wait: true
  force: false
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: t4clusterhosts.cluster.t4.dev
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: t4workspaces.cluster.t4.dev
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: t4sessions.cluster.t4.dev
