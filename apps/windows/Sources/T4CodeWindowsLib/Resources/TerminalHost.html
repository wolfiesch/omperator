<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omperator Terminal</title>
  <link rel="stylesheet" href="/xterm.css">
  <style>
    html, body, #terminal {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    html, body { background: transparent; }
    #terminal { box-sizing: border-box; padding: 7px 8px 5px; }
    .xterm { height: 100%; }
    .xterm-viewport { scrollbar-color: rgba(152, 147, 165, 0.62) transparent; scrollbar-width: thin; }
    .xterm-viewport::-webkit-scrollbar { width: 7px; }
    .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
    .xterm-viewport::-webkit-scrollbar-thumb {
      background: rgba(152, 147, 165, 0.62);
      border: 2px solid transparent;
      border-radius: 999px;
      background-clip: padding-box;
    }
  </style>
</head>
<body>
  <main id="terminal" aria-label="Host terminal"></main>
  <script src="/xterm.js"></script>
  <script src="/xterm-addon-fit.js"></script>
  <script src="/TerminalBridge.js"></script>
</body>
</html>
