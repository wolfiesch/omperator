name: T4Code
options:
  bundleIdPrefix: sh.t4code
  deploymentTarget:
    iOS: "26.0"
packages:
  HostWire:
    path: HostWire
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.15.0"
targets:
  T4Code:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Resources
    dependencies:
      - package: HostWire
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.t4code.ios
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Enclave-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: YES
  T4CodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: T4Code
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.t4code.ios.uitests
        TEST_TARGET_NAME: T4Code
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  T4Code:
    build:
      targets:
        T4Code: all
        T4CodeUITests: [test]
    test:
      targets:
        - T4CodeUITests
