name: T4Code
options:
  bundleIdPrefix: sh.t4code
  deploymentTarget:
    iOS: "26.0"
packages:
  HostWire:
    path: HostWire
targets:
  T4Code:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Resources
    dependencies:
      - package: HostWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.t4code.ios
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Enclave-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: YES
